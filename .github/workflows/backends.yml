name: Backend compile checks

# Build and link the RYZENStrata gfx1151 engine without a GPU or model weights.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/backends.yml
      - engine/CMakeLists.txt
      - engine/CMakePresets.json
      - engine/cmake/**
      - engine/src/**
      - engine/include/**
      - engine/third_party/**
      - terminal/setup.py
      - tools/packaging/build_hip_linux.sh
  pull_request:
    paths:
      - .github/workflows/backends.yml
      - engine/CMakeLists.txt
      - engine/CMakePresets.json
      - engine/cmake/**
      - engine/src/**
      - engine/include/**
      - engine/third_party/**
      - terminal/setup.py
      - tools/packaging/build_hip_linux.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backends-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  hip:
    name: HIP gfx1151
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: rocm/dev-ubuntu-24.04:7.2.4-complete
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build ccache
          cmake --version | head -1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-hip72-${{ hashFiles('engine/CMakeLists.txt', 'engine/src/**', 'engine/include/**', 'engine/cmake/**') }}
          restore-keys: ccache-hip72-
      - name: Configure (preset hip-compile)
        run: |
          /opt/rocm/llvm/bin/clang++ --version | head -1
          cmake -S engine --preset hip-compile -B build \
            -DCMAKE_HIP_ARCHITECTURES=gfx1151 -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ -DCMAKE_HIP_COMPILER_ROCM_ROOT=/opt/rocm -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_HIP_COMPILER_LAUNCHER=ccache
      - name: Build strata
        run: cmake --build build --target strata -j "$(nproc)"
      - name: Cache statistics
        run: ccache -s | head -8
